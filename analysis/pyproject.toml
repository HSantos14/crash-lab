[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashlab-analysis"
version = "0.1.0"
description = "Motor de análise de velas para o Crash Lab (biblioteca pura, sem I/O)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["crashlab_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=crashlab_analysis --cov-report=term-missing"

[tool.ruff]
line-length = 100
